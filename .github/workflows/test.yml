name: 🧪 CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          jq --version

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq
          jq --version

      - name: Make scripts executable
        run: chmod +x bin.sh code_dump.py

      - name: Debug - show files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Python version:"
          python3 --version
          echo "Bash version:"
          bash --version

      - name: Test Mode 1 (simple code folder)
        run: |
          set -x  # Print each command
          
          # Clean up
          rm -rf code CODE Code code_report.txt 2>/dev/null || true
          
          # Create test code folder
          mkdir -p code
          echo "print('hello world')" > code/test.py
          echo "README content" > code/readme.md
          
          # Show what we created
          echo "Code folder contents:"
          ls -la code/
          
          # Run Mode 1 with automation
          echo "Running: echo '1' | ./bin.sh"
          echo "1" | ./bin.sh
          
          # Check result
          if [ -f code_report.txt ]; then
            echo "✅ code_report.txt exists"
            echo "File size: $(wc -c < code_report.txt) bytes"
            echo "First 10 lines:"
            head -10 code_report.txt
            exit 0
          else
            echo "❌ code_report.txt not found!"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
        shell: bash

      - name: Test Mode 2 (with settings.json)
        run: |
          set -x
          
          # Clean up
          rm -rf code CODE Code code_report*.txt settings.json backup 2>/dev/null || true
          
          # Create test project
          mkdir -p test_project
          echo "console.log('test');" > test_project/app.js
          echo '{"version": "1.0"}' > test_project/config.json
          
          # Create settings.json
          cat > settings.json << 'EOF'
          {
            "enabled": true,
            "global": {
              "include_extensions": [".js", ".json"]
            },
            "projects": [
              {
                "name": "TestProject",
                "path": "./test_project",
                "enabled": true
              }
            ]
          }
          EOF
          
          echo "settings.json created:"
          cat settings.json
          
          # Run Mode 2
          echo "2" | ./bin.sh
          
          # Check result
          if [ -f code_report_TestProject.txt ]; then
            echo "✅ code_report_TestProject.txt exists"
            echo "File size: $(wc -c < code_report_TestProject.txt) bytes"
            exit 0
          else
            echo "❌ code_report_TestProject.txt not found!"
            echo "Files in current directory:"
            ls -la
            exit 1
          fi
        shell: bash

      - name: Test Python direct call
        run: |
          set -x
          
          rm -rf code_report.txt 2>/dev/null || true
          mkdir -p code
          echo "test content" > code/test.txt
          
          python3 code_dump.py code --single --output code_report.txt --no-config
          
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Python direct call passed"
            exit 0
          else
            echo "❌ Python direct call failed"
            exit 1
          fi
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 TEST SUMMARY - ${{ runner.os }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Generated reports:"
          ls -la code_report*.txt 2>/dev/null || echo "  (none)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        shell: bash
