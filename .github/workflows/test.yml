name: 🧪 CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Make scripts executable
        run: chmod +x bin.sh code_dump.py

      - name: Test Mode 1 (code folder)
        run: |
          rm -rf code CODE Code code_report.txt 2>/dev/null || true
          
          mkdir -p code
          echo "print('hello world')" > code/test.py
          echo "README content" > code/readme.md
          
          # Run with || true to ignore the read prompt error
          echo "1" | ./bin.sh || true
          
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Mode 1 passed"
          else
            echo "❌ Mode 1 failed"
            exit 1
          fi
        shell: bash

      - name: Test Mode 2 (settings.json)
        run: |
          rm -rf code CODE Code code_report*.txt settings.json backup 2>/dev/null || true
          
          mkdir -p test_project
          echo "console.log('test');" > test_project/app.js
          echo '{"version": "1.0"}' > test_project/config.json
          
          cat > settings.json << 'EOF'
          {
            "enabled": true,
            "global": {
              "include_extensions": [".js", ".json"]
            },
            "projects": [
              {
                "name": "TestProject",
                "path": "./test_project",
                "enabled": true
              }
            ]
          }
          EOF
          
          echo "2" | ./bin.sh || true
          
          if [ -f code_report_TestProject.txt ] && [ -s code_report_TestProject.txt ]; then
            echo "✅ Mode 2 passed"
          else
            echo "❌ Mode 2 failed"
            exit 1
          fi
        shell: bash

      - name: Test Python direct call (bypassing bin.sh)
        run: |
          rm -rf code_report.txt 2>/dev/null || true
          mkdir -p code
          echo "test content" > code/test.txt
          
          python3 code_dump.py code --single --output code_report.txt --no-config
          
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Python direct call passed"
          else
            echo "❌ Python direct call failed"
            exit 1
          fi
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 TEST SUMMARY - ${{ runner.os }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -la code_report*.txt 2>/dev/null || echo "No reports"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        shell: bash
