name: 🧪 CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Windows temporarily disabled due to WSL/bash issues

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Make scripts executable
        run: chmod +x bin.sh code_dump.py

      - name: Test Mode 1 (simple code folder)
        run: |
          # Clean up any existing code folder first
          rm -rf code CODE Code 2>/dev/null || true
          
          # Create test code folder
          mkdir -p code
          echo "print('hello world')" > code/test.py
          echo "README content" > code/readme.md
          
          # Run Mode 1 with automation (send '1' to stdin)
          echo "1" | ./bin.sh
          
          # Verify output
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Mode 1 passed - code_report.txt created"
            exit 0
          else
            echo "❌ Mode 1 failed - code_report.txt not found or empty"
            exit 1
          fi
        shell: bash

      - name: Test Mode 2 (with settings.json)
        run: |
          # Clean up
          rm -rf code CODE Code code_report*.txt settings.json backup 2>/dev/null || true
          
          # Create test project
          mkdir -p test_project
          echo "console.log('test');" > test_project/app.js
          echo '{"version": "1.0"}' > test_project/config.json
          
          # Create settings.json
          cat > settings.json << 'EOF'
          {
            "enabled": true,
            "global": {
              "include_extensions": [".js", ".json"]
            },
            "projects": [
              {
                "name": "TestProject",
                "path": "./test_project",
                "enabled": true
              }
            ]
          }
          EOF
          
          # Run Mode 2
          echo "2" | ./bin.sh
          
          # Verify
          if [ -f code_report_TestProject.txt ] && [ -s code_report_TestProject.txt ]; then
            echo "✅ Mode 2 passed - code_report_TestProject.txt created"
            exit 0
          else
            echo "❌ Mode 2 failed"
            ls -la
            exit 1
          fi
        shell: bash

      - name: Test JSON validation (invalid JSON)
        run: |
          echo "{ invalid json without quotes" > settings.json
          
          OUTPUT=$(echo "2" | ./bin.sh 2>&1)
          
          if echo "$OUTPUT" | grep -qi "invalid json"; then
            echo "✅ JSON validation correctly detected error"
          else
            echo "⚠️ JSON validation message check (continuing)"
          fi
          
          # Don't fail this test - just warning
          exit 0
        shell: bash
        continue-on-error: true

      - name: Test missing code folder
        run: |
          rm -rf code CODE Code 2>/dev/null || true
          
          OUTPUT=$(echo "1" | ./bin.sh 2>&1)
          
          if echo "$OUTPUT" | grep -q "code folder not found"; then
            echo "✅ Missing folder detection works"
          else
            echo "⚠️ Missing folder message not found"
          fi
          exit 0
        shell: bash
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 TEST SUMMARY - ${{ runner.os }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Generated reports:"
          ls -la code_report*.txt 2>/dev/null || echo "  (none)"
          echo ""
          echo "Backup folder:"
          ls -la backup/ 2>/dev/null || echo "  (none)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        shell: bash
