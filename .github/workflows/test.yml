name: 🧪 CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        run: choco install jq
        shell: powershell

      - name: Make scripts executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x bin.sh code_dump.py

      # ============================================================
      # Linux & macOS Tests
      # ============================================================
      - name: Test Mode 1 (code folder) - Unix
        if: runner.os != 'Windows'
        run: |
          rm -rf code CODE Code code_report.txt 2>/dev/null || true
          
          mkdir -p code
          echo "print('hello world')" > code/test.py
          echo "README content" > code/readme.md
          
          # Run with || true to ignore the read prompt error
          echo "1" | ./bin.sh || true
          
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Mode 1 passed"
          else
            echo "❌ Mode 1 failed"
            exit 1
          fi
        shell: bash

      - name: Test Mode 2 (settings.json) - Unix
        if: runner.os != 'Windows'
        run: |
          rm -rf code CODE Code code_report*.txt settings.json backup 2>/dev/null || true
          
          mkdir -p test_project
          echo "console.log('test');" > test_project/app.js
          echo '{"version": "1.0"}' > test_project/config.json
          
          cat > settings.json << 'EOF'
          {
            "enabled": true,
            "global": {
              "include_extensions": [".js", ".json"]
            },
            "projects": [
              {
                "name": "TestProject",
                "path": "./test_project",
                "enabled": true
              }
            ]
          }
          EOF
          
          echo "2" | ./bin.sh || true
          
          if [ -f code_report_TestProject.txt ] && [ -s code_report_TestProject.txt ]; then
            echo "✅ Mode 2 passed"
          else
            echo "❌ Mode 2 failed"
            exit 1
          fi
        shell: bash

      - name: Test Python direct call (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf code_report.txt 2>/dev/null || true
          mkdir -p code
          echo "test content" > code/test.txt
          
          python3 code_dump.py code --single --output code_report.txt --no-config
          
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Python direct call passed"
          else
            echo "❌ Python direct call failed"
            exit 1
          fi
        shell: bash

      # ============================================================
      # Windows Tests (PowerShell, CMD, Git Bash)
      # ============================================================
      - name: Test PowerShell runner (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Clean up
          Remove-Item -Path code, CODE, Code, code_report*.txt -Recurse -Force -ErrorAction SilentlyContinue
          
          # Create test files
          New-Item -ItemType Directory -Path code -Force | Out-Null
          "Write-Host 'PowerShell test'" | Out-File -FilePath code/test.ps1 -Encoding UTF8
          
          # Use the simple test runner instead of interactive run.ps1
          python code_dump.py code --single --output code_report.txt --no-config
          
          # Verify
          if (Test-Path code_report.txt) {
            $size = (Get-Item code_report.txt).Length
            Write-Host "✅ PowerShell test passed - Report size: $size bytes" -ForegroundColor Green
          } else {
            Write-Host "❌ PowerShell test failed" -ForegroundColor Red
            exit 1
          }

      - name: Test CMD runner (Windows only)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          del /q code_report.txt 2>nul
          rmdir /s /q code 2>nul
          
          mkdir code
          echo @echo off > code\test.bat
          
          python code_dump.py code --single --output code_report.txt --no-config
          
          if exist code_report.txt (
            echo ✅ CMD test passed
          ) else (
            echo ❌ CMD test failed
            exit 1
          )

      - name: Test Git Bash on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf code CODE Code code_report.txt 2>/dev/null || true
          
          mkdir -p code
          echo "print('git bash test')" > code/test.py
          
          python3 code_dump.py code --single --output code_report.txt --no-config
          
          if [ -f code_report.txt ] && [ -s code_report.txt ]; then
            echo "✅ Git Bash test passed"
          else
            echo "❌ Git Bash test failed"
            exit 1
          fi

      - name: Test Mode 2 with settings.json (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Clean up
          Remove-Item -Path code_report*.txt, settings.json, backup -Recurse -Force -ErrorAction SilentlyContinue
          
          # Create test project
          New-Item -ItemType Directory -Path test_project -Force | Out-Null
          "console.log('test');" | Out-File -FilePath test_project/app.js -Encoding UTF8
          '{"version": "1.0"}' | Out-File -FilePath test_project/config.json -Encoding UTF8
          
          # Create settings.json
          @'
          {
            "enabled": true,
            "global": {
              "include_extensions": [".js", ".json"]
            },
            "projects": [
              {
                "name": "WindowsTest",
                "path": "./test_project",
                "enabled": true
              }
            ]
          }
          '@ | Out-File -FilePath settings.json -Encoding UTF8
          
          # Run Mode 2
          python code_dump.py test_project --single --output code_report_WindowsTest.txt
          
          # Verify
          if (Test-Path code_report_WindowsTest.txt) {
            $size = (Get-Item code_report_WindowsTest.txt).Length
            Write-Host "✅ Mode 2 (Windows) passed - Report size: $size bytes" -ForegroundColor Green
          } else {
            Write-Host "❌ Mode 2 (Windows) failed" -ForegroundColor Red
            exit 1
          }

      # ============================================================
      # Summary for all platforms
      # ============================================================
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 TEST SUMMARY - ${{ runner.os }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Generated reports:"
          ls -la code_report*.txt 2>/dev/null || echo "  (none)"
          echo ""
          echo "Backup folder:"
          ls -la backup/ 2>/dev/null || echo "  (none)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        shell: bash
