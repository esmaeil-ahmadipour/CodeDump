name: 🧪 CI Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-all:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
        
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq
        
      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        run: choco install jq
        shell: powershell
        
      - name: Make scripts executable
        if: runner.os != 'Windows'
        run: chmod +x bin.sh code_dump.py
        
      - name: Run Mode 1 Test
        run: |
          mkdir -p code
          echo "print('test')" > code/test.py
          echo "1" | ./bin.sh
          test -f code_report.txt && echo "✅ Mode 1 passed" || exit 1
        shell: bash
        
      - name: Run Mode 2 Test
        run: |
          cat > settings.json << 'EOF'
          {
            "projects": [
              {"name": "Test", "path": "./code", "enabled": true}
            ]
          }
          EOF
          echo "2" | ./bin.sh
          test -f code_report_Test.txt && echo "✅ Mode 2 passed" || exit 1
        shell: bash
        
      - name: Test JSON validation
        run: |
          echo "{ invalid" > settings.json
          echo "2" | ./bin.sh 2>&1 | grep -q "Invalid JSON" && echo "✅ Validation passed" || echo "⚠️ Validation check"
        shell: bash
        continue-on-error: true
