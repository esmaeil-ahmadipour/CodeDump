name: 🚀 Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  PROJECT_NAME: 'CodeDump'

jobs:
  test:
    name: 🧪 Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 🔧 Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: 🔧 Install jq (Windows)
        if: runner.os == 'Windows'
        run: choco install jq
        shell: powershell

      - name: 🔧 Make scripts executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x bin.sh code_dump.py

      - name: 🧪 Run tests
        run: |
          mkdir -p test_output
          cd tests 2>/dev/null || mkdir -p tests && cd tests
          
          cat > test_runner.py << 'EOF'
import os
import sys
import subprocess
import tempfile
import shutil
import json

def test_mode1():
    print("Testing Mode 1...")
    with tempfile.TemporaryDirectory() as tmpdir:
        os.chdir(tmpdir)
        
        shutil.copy(sys.argv[1], "bin.sh")
        shutil.copy(sys.argv[2], "code_dump.py")
        os.chmod("bin.sh", 0o755)
        os.chmod("code_dump.py", 0o755)
        
        os.makedirs("code")
        with open("code/test.py", "w") as f:
            f.write("print('hello')")
        
        proc = subprocess.run(['bash', '-c', 'echo "1" | ./bin.sh'], 
                              capture_output=True, text=True, cwd=tmpdir)
        
        assert os.path.exists("code_report.txt"), "Report not created"
        with open("code_report.txt") as f:
            content = f.read()
            assert "test.py" in content, "test.py not found in report"
        
        print("✓ Mode 1 passed")

def test_mode2():
    print("Testing Mode 2...")
    with tempfile.TemporaryDirectory() as tmpdir:
        os.chdir(tmpdir)
        
        shutil.copy(sys.argv[1], "bin.sh")
        shutil.copy(sys.argv[2], "code_dump.py")
        os.chmod("bin.sh", 0o755)
        os.chmod("code_dump.py", 0o755)
        
        os.makedirs("code")
        with open("code/test.py", "w") as f:
            f.write("print('hello')")
        
        config = {
            "projects": [
                {"name": "Test", "path": "./code", "enabled": True}
            ]
        }
        with open("settings.json", "w") as f:
            json.dump(config, f)
        
        proc = subprocess.run(['bash', '-c', 'echo "2" | ./bin.sh'], 
                              capture_output=True, text=True, cwd=tmpdir)
        
        assert os.path.exists("code_report_Test.txt"), "Project report not created"
        print("✓ Mode 2 passed")

def test_json_validation():
    print("Testing JSON validation...")
    with tempfile.TemporaryDirectory() as tmpdir:
        os.chdir(tmpdir)
        
        shutil.copy(sys.argv[1], "bin.sh")
        shutil.copy(sys.argv[2], "code_dump.py")
        os.chmod("bin.sh", 0o755)
        
        with open("settings.json", "w") as f:
            f.write("{ invalid json")
        
        proc = subprocess.run(['bash', '-c', 'echo "2" | ./bin.sh'], 
                              capture_output=True, text=True, cwd=tmpdir)
        
        assert "Invalid JSON" in proc.stdout, "JSON validation failed"
        print("✓ JSON validation passed")

if __name__ == "__main__":
    bin_sh = sys.argv[1]
    code_dump = sys.argv[2]
    
    test_mode1()
    test_mode2()
    test_json_validation()
    
    print("\n✅ All tests passed!")
EOF
          
          python3 test_runner.py ../bin.sh ../code_dump.py
        shell: bash

      - name: 📊 Test summary
        if: always()
        run: echo "✅ Tests completed on ${{ runner.os }}"

  build-linux:
    name: 🐧 Build for Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Linux package
        run: |
          mkdir -p CodeDump-linux/code
          cp bin.sh code_dump.py settings.json README.md CodeDump-linux/ 2>/dev/null || true
          chmod +x CodeDump-linux/bin.sh CodeDump-linux/code_dump.py
          
          echo "# Sample Code Folder" > CodeDump-linux/code/README.md
          echo "" >> CodeDump-linux/code/README.md
          echo "Place your project files inside this folder, then run ./bin.sh and select option 1." >> CodeDump-linux/code/README.md
          
          cat > CodeDump-linux/README.txt << 'EOF'
          CodeDump - Linux
          
          Structure:
          - bin.sh
          - code/README.md
          - code_dump.py
          - README.md
          - settings.json
          
          Quick Start:
          1. Install: sudo apt install python3 jq
          2. Run: ./bin.sh
          3. Select mode 1 or 2
          EOF
          
          tar -czvf CodeDump-linux.tar.gz CodeDump-linux/
          
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: codedump-linux
          path: CodeDump-linux.tar.gz

  build-macos:
    name: 🍎 Build for macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Create macOS package
        run: |
          mkdir -p CodeDump-macOS/code
          cp bin.sh code_dump.py settings.json README.md CodeDump-macOS/ 2>/dev/null || true
          chmod +x CodeDump-macOS/bin.sh CodeDump-macOS/code_dump.py
          
          echo "# Sample Code Folder" > CodeDump-macOS/code/README.md
          echo "" >> CodeDump-macOS/code/README.md
          echo "Place your project files inside this folder, then run ./bin.sh and select option 1." >> CodeDump-macOS/code/README.md
          
          cat > CodeDump-macOS/run.command << 'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          ./bin.sh
          EOF
          chmod +x CodeDump-macOS/run.command
          
          cat > CodeDump-macOS/README.txt << 'EOF'
          CodeDump - macOS
          
          Structure:
          - bin.sh
          - code/README.md
          - code_dump.py
          - README.md
          - run.command
          - settings.json
          
          Quick Start:
          1. Install: brew install python3 jq
          2. Run: ./bin.sh or double-click run.command
          3. Select mode 1 or 2
          EOF
          
          tar -czvf CodeDump-macOS.tar.gz CodeDump-macOS/
          
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: codedump-macos
          path: CodeDump-macOS.tar.gz

  build-windows:
    name: 🪟 Build for Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Windows package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path CodeDump-Windows -Force
          New-Item -ItemType Directory -Path CodeDump-Windows/code -Force
          
          Copy-Item bin.sh -Destination CodeDump-Windows/
          Copy-Item code_dump.py -Destination CodeDump-Windows/
          Copy-Item settings.json -Destination CodeDump-Windows/
          Copy-Item README.md -Destination CodeDump-Windows/ -ErrorAction SilentlyContinue
          
          @"
          # Sample Code Folder
          
          Place your project files inside this folder, then run run.ps1 (PowerShell) or run.bat (CMD) and select option 1.
          "@ | Out-File -FilePath CodeDump-Windows/code/README.md -Encoding UTF8
          
          @"
          `$choice = Read-Host "Select mode (1=code folder, 2=settings.json)"
          
          if (`$choice -eq "1") {
              if (Test-Path "code") { python code_dump.py code --single --output code_report.txt --no-config }
              elseif (Test-Path "CODE") { python code_dump.py CODE --single --output code_report.txt --no-config }
              else { Write-Host "code folder not found!" -ForegroundColor Red }
          } 
          elseif (`$choice -eq "2") {
              if (Test-Path "settings.json") {
                  `$config = Get-Content settings.json -Raw | ConvertFrom-Json
                  foreach (`$proj in `$config.projects | Where-Object { `$_.enabled -ne `$false }) {
                      Write-Host "Processing `$(`$proj.name)..."
                      python code_dump.py `$proj.path --single --output "code_report_`$(`$proj.name).txt"
                  }
              }
              else { Write-Host "settings.json not found!" -ForegroundColor Red }
          }
          Read-Host "Press Enter to exit"
          "@ | Out-File -FilePath CodeDump-Windows/run.ps1 -Encoding UTF8
          
          @"
          @echo off
          set /p choice="Select mode (1=code folder, 2=settings.json): "
          if "%choice%"=="1" (
              if exist code\ (python code_dump.py code --single --output code_report.txt --no-config) else (echo code folder not found!)
          ) else if "%choice%"=="2" (
              if exist settings.json (python -c "import json; import subprocess; config = json.load(open('settings.json')); [subprocess.run(['python', 'code_dump.py', p['path'], '--single', '--output', f'code_report_{p.get("name", "project")}.txt']) for p in config.get('projects', []) if p.get('enabled', True)]") else (echo settings.json not found!)
          ) else (echo Invalid choice!)
          pause
          "@ | Out-File -FilePath CodeDump-Windows/run.bat -Encoding ascii
          
          @'
          #!/bin/bash
          ./bin.sh
          '@ | Out-File -FilePath CodeDump-Windows/run-wsl.sh -Encoding UTF8
          
          @"
          CodeDump - Windows
          
          Structure:
          - bin.sh
          - code/README.md
          - code_dump.py
          - README.md
          - run.bat
          - run.ps1
          - run-wsl.sh
          - settings.json
          
          Ways to run:
          - PowerShell: .\run.ps1
          - CMD: run.bat
          - WSL/Git Bash: ./bin.sh or ./run-wsl.sh
          
          Requirements: Python 3.8+, jq (optional for Mode 2)
          "@ | Out-File -FilePath CodeDump-Windows/README.txt -Encoding UTF8
          
          Compress-Archive -Path CodeDump-Windows/* -DestinationPath CodeDump-Windows.zip -Force
          
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: codedump-windows
          path: CodeDump-Windows.zip

  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
      actions: read
      
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: List artifacts
        run: |
          echo "Artifacts downloaded:"
          ls -la artifacts/
          ls -la artifacts/*/ || true
          
      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "CodeDump ${{ steps.tag.outputs.TAG_NAME }}"
          files: |
            artifacts/codedump-linux/CodeDump-linux.tar.gz
            artifacts/codedump-macos/CodeDump-macOS.tar.gz
            artifacts/codedump-windows/CodeDump-Windows.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            ## CodeDump ${{ steps.tag.outputs.TAG_NAME }}
            
            ### Features
            - Dual mode operation (code folder + settings.json projects)
            - JSON configuration with validation
            - Automatic backups
            
            ### Downloads
            
            | OS | File | Run Command |
            |:---|:---|:---|
            | Linux | CodeDump-linux.tar.gz | ./bin.sh |
            | macOS | CodeDump-macOS.tar.gz | ./bin.sh or double-click run.command |
            | Windows | CodeDump-Windows.zip | run.ps1 (PowerShell) or run.bat (CMD) |
            
            ### Package Structure
            
            .
            ├── bin.sh
            ├── code/
            │   └── README.md
            ├── code_dump.py
            ├── README.md
            └── settings.json
            
            ### Quick Start
            
            Linux/macOS:
              tar -xzf CodeDump-linux.tar.gz
              cd CodeDump-linux
              ./bin.sh
            
            Windows (PowerShell):
              Expand-Archive CodeDump-Windows.zip
              cd CodeDump-Windows
              .\run.ps1
            
            ### Links
            - GitHub Repository: https://github.com/${{ github.repository }}
            - Report Issues: https://github.com/${{ github.repository }}/issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
